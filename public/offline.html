<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#143e2c">
    <title>Tanpa koneksi - SILAGAR</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: #f0fdf1; color: #131e17; font: 16px/1.5 system-ui, sans-serif; }
        header { background: #143e2c; color: white; padding: 2rem max(1rem, calc((100% - 28rem) / 2)); }
        header p { margin: 0; color: #d1fae5; font-size: .875rem; font-weight: 600; }
        main { max-width: 28rem; margin: 2rem auto; padding: 0 1rem; }
        section { border: 1px solid #e7e5e4; border-radius: .75rem; background: white; padding: 1.5rem; }
        h1 { margin: 0; color: #143e2c; font-size: 1.5rem; }
        section p { margin: .75rem 0 1.5rem; color: #44403c; }
        a { display: inline-flex; min-height: 3rem; align-items: center; border-radius: .75rem; background: #143e2c; padding: 0 1.25rem; color: white; font-weight: 700; text-decoration: none; }
        a:focus-visible { outline: 2px solid #143e2c; outline-offset: 3px; }
    </style>
</head>
<body>
    <header><p>SILAGAR</p></header>
    <main>
        <section>
            <h1>Halaman belum tersedia luring</h1>
            <p>Hubungkan perangkat ke internet, lalu coba buka halaman ini lagi. Data sensus yang sudah disimpan di perangkat tetap tersimpan.</p>
            <a href="/">Coba lagi</a>
        </section>
    </main>
</body>
</html>
